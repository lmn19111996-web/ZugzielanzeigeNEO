<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Ersatzverkehr pictogram (full color, used as a background image - not a
     mask). Colors are the app's SEV colors: magenta #97235d (Belegungsplan
     SEV blocks), yellow #f5c400 (the "sev" line color). -->
<!-- Plate + white inner frame -->
<rect width="24" height="24" fill="#97235d"/>
<rect x="1.3" y="1.3" width="21.4" height="21.4" stroke="#ffffff" stroke-width="0.9"/>

<!-- Bus in a yellow circle -->
<circle cx="15.6" cy="8.3" r="5.5" fill="#f5c400"/>
<rect x="12.7" y="4.6" width="5.8" height="6.6" rx="1.1" fill="#97235d"/>
<rect x="13.45" y="5.75" width="4.3" height="2.5" rx="0.3" fill="#f5c400"/>
<circle cx="13.9" cy="9.75" r="0.5" fill="#f5c400"/>
<circle cx="17.3" cy="9.75" r="0.5" fill="#f5c400"/>
<rect x="13.15" y="11" width="1.15" height="1.15" rx="0.2" fill="#97235d"/>
<rect x="16.9" y="11" width="1.15" height="1.15" rx="0.2" fill="#97235d"/>
<rect x="12.15" y="5.6" width="0.5" height="1.4" rx="0.2" fill="#97235d"/>
<rect x="18.55" y="5.6" width="0.5" height="1.4" rx="0.2" fill="#97235d"/>

<!-- Train (front view) with pantograph, on a track -->
<path d="M4.8 9.3 H7.2 M5.2 9.3 L6 10.7 L6.8 9.3" stroke="#ffffff" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M3.5 18 V12.9 C3.5 11.5 4.5 10.7 6 10.7 C7.5 10.7 8.5 11.5 8.5 12.9 V18 Z" fill="#ffffff"/>
<rect x="4.25" y="12.2" width="3.5" height="2.1" rx="0.4" fill="#97235d"/>
<circle cx="4.75" cy="16.55" r="0.45" fill="#97235d"/>
<circle cx="7.25" cy="16.55" r="0.45" fill="#97235d"/>
<path d="M4.1 18 L3.4 19.2 M7.9 18 L8.6 19.2 M2.6 19.4 H9.4" stroke="#ffffff" stroke-width="0.75" stroke-linecap="round"/>

<!-- Arrow: from the train to the right, then up toward the bus -->
<path d="M10.2 18.3 H17.6 C18.25 18.3 18.6 17.95 18.6 17.3 V15.3" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M16.95 16.75 L18.6 15.0 L20.25 16.75" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
